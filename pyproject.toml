[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "arrowspace"
readme = "README.md"
description = "Python bindings for ArrowSpace (Rust) providing graph-based similarity search, signal graphs, and spectral methods for vector data."
license = "MIT OR Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Lorenzo", email = "tunedconsulting@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["vector-search", "spectral-analysis", "graph-signal", "similarity-search", "machine-learning"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database :: Front-Ends",  # for vector DB/search integrations
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",  # valid trove classifier via trove-classifiers set
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = [
    "numpy>=2.4.2",
    "pyarrow>=23.0.0",
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
# Embedding model support (sentence-transformers, TSDAE, HuggingFace)
embeddings = [
    "sentence-transformers>=5.2.0",
    "transformers[torch]<5.0",
    "tsdae>=1.1.0",
]
# Benchmark and dataset utilities (BEIR, HuggingFace datasets, NLTK)
benchmarks = [
    "beir>=2.2.0",
    "datasets>=4.5.0",
    "nltk>=3.10.0",
]
# Visualisation and progress utilities
viz = [
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]
# Convenience: install everything (e.g. for running the full test suite)
full = [
    "arrowspace[embeddings,benchmarks,viz]",
]

[project.urls]
Homepage = "https://github.com/tuned-org-uk/pyarrowspace"
Repository = "https://github.com/tuned-org-uk/pyarrowspace.git"

[tool.maturin]
features = ["pyo3/extension-module"]
sdist-include = ["LICENSE", "README.md"]

exclude = [
    "tests/",           # Exclude the entire 'tests' directory
    ".github/",            # Exclude the 'docs' directory
    ".venv",
    "**/*.pyc",         # Exclude all compiled Python files
    "TAUMODE.md",
    "NORMALISATION.md",
    "GRAPH_VARIABLES.md",
    ".gitignore",
    "*.npy",
    "storage",
    "target",
    "test_*/",
    "cve_*/",
    "arxiv_*/",
    "domain_adapted_*/",
    "checkpoints",
    "analyzer",
    "notebooks",
    "neurips",
]
